version: 1

defaults:
  provider: yfinance
  start_date: "2010-01-01"
  end_date: null
  interval: 1d

# Minimum viable universe for silver trend + regime work.
# Adjust symbols per provider/data vendor.
universe:
  silver:
    - SI=F       # Silver futures (primary)
    # - XAGUSD=X  # REMOVED: yfinance fails for this symbol
    - SLV        # iShares Silver Trust ETF
    - SIVR       # Aberdeen Standard Silver ETF
    - SIL        # Global X Silver Miners ETF
    - SILJ       # ETFMG Prime Junior Silver ETF

  cross_metals:
    - GC=F       # Gold futures (primary)
    # - XAUUSD=X  # REMOVED: yfinance fails for this symbol
    - GLD        # SPDR Gold Trust ETF (alternative to XAUUSD=X)
    - HG=F       # Copper futures

  macro:
    - DX-Y.NYB
    - ^TNX
    - ^IRX
    - ^VIX
    - SPY
    - QQQ

outputs:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  metadata_dir: data/raw/_runs

# Optional: asset manifolds for sectional curvature + stress differentials.
# Used by: `python src/pipeline/silver_pipeline.py features --sectional-curvature --config configs/silver_universe.yaml`
manifolds:
  monetary:
    symbols:
      - DX-Y.NYB
      - UUP
      - ^IRX
      - ^FVX
      - ^TNX
      - ^TYX
      - SHY
      - IEF
      - TLT
      - TIP
      - RINF
  industrial:
    symbols:
      - HG=F
      - CL=F
      - BZ=F
      - NG=F
      - USO
      - XLE
      - OIH
      - DBC
      - GSG
  miners:
    symbols:
      - SIL
      - SILJ
  credit:
    symbols:
      - LQD
      - HYG
      - JNK
      - EMB
      - MUB
  volatility:
    symbols:
      - ^VIX
      - ^VXN
